<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon Mai — Đặt lịch AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 420px;
      height: 680px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-info h2 { font-size: 16px; font-weight: 600; }
    .header-info p { font-size: 12px; opacity: 0.8; margin-top: 2px; }

    .status-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    /* Messages area */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 2px; }

    /* Bubble */
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      background: #667eea;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .bubble.agent {
      background: #f1f0f0;
      color: #1a1a1a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 14px;
      background: #f1f0f0;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      width: fit-content;
    }

    .typing span {
      width: 8px; height: 8px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input area */
    .input-area {
      padding: 16px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      border: 1.5px solid #e0e0e0;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 100px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: #667eea; }

    button {
      width: 40px; height: 40px;
      background: #667eea;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    button:hover { background: #5a6fd6; }
    button:active { transform: scale(0.92); }
    button:disabled { background: #ccc; cursor: not-allowed; }

    /* Quick replies */
    .quick-replies {
      padding: 0 16px 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-btn {
      background: white;
      border: 1.5px solid #667eea;
      color: #667eea;
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      width: auto;
      height: auto;
    }

    .quick-btn:hover {
      background: #667eea;
      color: white;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <!-- Header -->
  <div class="chat-header">
    <div class="avatar">💇</div>
    <div class="header-info">
      <h2>Mai — Salon Mai</h2>
      <p><span class="status-dot"></span>Trợ lý đặt lịch AI</p>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages"></div>

  <!-- Quick replies -->
  <div class="quick-replies" id="quickReplies">
    <button class="quick-btn" onclick="sendQuick('Xem danh sách dịch vụ')">📋 Dịch vụ & giá</button>
    <button class="quick-btn" onclick="sendQuick('Tôi muốn đặt lịch')">📅 Đặt lịch</button>
    <button class="quick-btn" onclick="sendQuick('Giờ mở cửa của salon?')">🕐 Giờ mở cửa</button>
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea
      id="input"
      placeholder="Nhắn tin cho Mai..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  // Tạo session_id ngẫu nhiên mỗi lần mở tab
  // Mỗi tab = 1 cuộc hội thoại riêng, agent nhớ context trong tab đó
  const SESSION_ID = 'session-' + Math.random().toString(36).substr(2, 9);
  // Slug lấy từ URL /chat/{slug}, không hardcode
  const TENANT_SLUG = window.location.pathname.split('/').filter(Boolean).pop();
  const API_URL = '/api/v1/chat/';

  // Hiển thị tin nhắn chào khi load trang — lấy tên tiệm/persona thật từ tenant API
  window.onload = async () => {
    let shopName = 'tiệm';
    let personaName = 'Trợ lý AI';
    try {
      const res = await fetch(`/api/v1/tenants/${TENANT_SLUG}`);
      if (res.ok) {
        const tenant = await res.json();
        shopName = tenant.name;
        personaName = tenant.persona_name;
        document.title = `${shopName} — Đặt lịch AI`;
      }
    } catch (err) {
      // giữ giá trị mặc định nếu không lấy được tenant
    }
    addBubble('agent', `Xin chào! Mình là ${personaName}, trợ lý đặt lịch của ${shopName} 💇\n\nMình có thể giúp bạn xem dịch vụ, kiểm tra lịch trống và đặt lịch hẹn. Bạn cần gì ạ?`);
  };

  function addBubble(role, text) {
    const messages = document.getElementById('messages');

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    // Render markdown bold (**text** → <strong>text</strong>)
bubble.innerHTML = text
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
  .replace(/\n/g, '<br>');

    messages.appendChild(bubble);

    // Scroll xuống cuối tự động
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping() {
    const messages = document.getElementById('messages');

    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.id = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';

    messages.appendChild(typing);
    messages.scrollTop = messages.scrollHeight;
  }

  function hideTyping() {
    const typing = document.getElementById('typing');
    if (typing) typing.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const message = input.value.trim();

    if (!message) return;

    // Hiển thị tin nhắn user
    addBubble('user', message);
    input.value = '';
    autoResize(input);

    // Disable input trong khi chờ
    input.disabled = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: SESSION_ID,
          tenant_slug: TENANT_SLUG,
          message: message,
        }),
      });

      const data = await response.json();
      hideTyping();
      addBubble('agent', data.reply);

    } catch (error) {
      hideTyping();
      addBubble('agent', 'Xin lỗi, có lỗi xảy ra. Vui lòng thử lại.');
      console.error('Error:', error);

    } finally {
      // Re-enable input
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function sendQuick(text) {
    document.getElementById('input').value = text;
    sendMessage();
  }

  // Enter gửi tin nhắn, Shift+Enter xuống dòng
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // Tự động resize textarea khi gõ nhiều dòng
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }
</script>

</body>
</html>
